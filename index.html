  if(d && d.chargily) chargilyMode = d.chargily.mode;
}).catch(()=>{});

let tt;function toast(m,fn,lb){const t=$('#ts');t.textContent=m;t.classList.toggle('act',!!fn);if(fn){const b=document.createElement('button');b.textContent=lb;b.onclick=()=>{fn();t.classList.remove('on')};t.append(' ',b)}t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),fn?4500:2500)}
function cp(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('تم النسخ ✓')).catch(()=>toast('تعذّر النسخ، انسخ يدويًا'))}
function theme(){const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';try{localStorage.setItem('ot',r.dataset.theme)}catch(e){}}
try{const s=localStorage.getItem('ot');if(s)document.documentElement.dataset.theme=s}catch(e){}
const gc=p=>`<div class="gc"><i class="ic" style="background:${p.c}">${p.l}</i><small>${p.n}</small></div>`;
const card=(p,ix=0)=>{const m=Math.max(...p.pl.map(x=>sv(p,x)));return `<a class="pc" href="#/p/${p.id}" style="--c:${p.c};--c2:${p.c2};--i:${ix}"><div class="pv"><div class="bds"><span class="bd fl">⚡ فوري</span>${m>0?`<span class="bd sv">حتى −${m}%</span>`:''}</div>${gc(p)}</div><div class="pi"><small>${p.cat}</small><h3>${p.t}</h3><div class="pr">ابتداءً من <b>${fmt(Math.min(...p.pl.map(x=>x[1])))}</b></div><div class="btn" style="margin:0">عرض الباقات</div></div></a>`};
const slide=(a,b,g,link,cta,ids)=>`<div class="sl" style="background:linear-gradient(135deg,${g})"><div class="tiles">${ids.map(i=>`<i class="ic" style="background:${pr(i).c}">${pr(i).l}</i>`).join('')}</div><h2>${a}</h2><p>${b}</p><a class="cta" href="${link}">${cta}</a></div>`;
const home=()=>`<div class="w"><div class="hero">${slide('اشتراكات الترفيه<br>بأسعار تناسبك','Netflix وCrunchyroll وShahid وPrime Video في مكان واحد','#12286E,#2F5BEA','#/shop','تصفّح الاشتراكات',['netflix','cr-mega','shahid','prime'])}${slide('دفع فوري وتلقائي<br>عبر Chargily Pay','ادفع بالبطاقة الذهبية أو CIB واستلم فوراً','#5C060C,#E50914','#/p/netflix','اطلب نتفلكس',['netflix'])}</div><h2 class="sh">اختر اشتراكك</h2><div class="g">${P.map(card).join('')}</div><h2 class="sh">لماذا تطلب من متجرنا؟</h2><div class="tr"><div><b>دفع إلكتروني تلقائي</b>عبر البطاقة الذهبية وCIB ببوابة Chargily Pay</div><div><b>شاشة خاصة بك</b>ملف شخصي باسمك ومقفل برمز PIN سري</div><div><b>دعم متواصل</b>برعاية بريدي موب، Binance، Redotpay أو Bybit</div></div><h2 class="sh">الأسئلة الشائعة</h2>${faqH}</div>`;
const shop=()=>{const cs=['الكل',...new Set(P.map(p=>p.cat))];return `<div class="w"><h1 class="ttl">المتجر</h1><div class="chips">${cs.map(c=>`<button class="chip ${c==cat?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('')}</div><div class="g" style="margin-top:8px">${P.filter(p=>cat=='الكل'||p.cat==cat).map(card).join('')}</div></div>`};
const prod=p=>{const x=p.pl[sel];return `<div class="ph" style="--c:${p.c};--c2:${p.c2}">${gc(p)}<h1>${p.t}</h1><p>${p.cat}</p></div><div class="w"><h2 class="sh">ما ستحصل عليه</h2><ul class="ft">${p.f.map(f=>`<li><i>✓</i>${f}</li>`).join('')}</ul><h2 class="sh">اختر باقتك</h2>${p.pl.map((y,i)=>`<button class="pl ${i==sel?'on':''}" onclick="pickPlan(${i})">${y[2]?'<span class="tag">الأوفر</span>':''}<span class="rd"></span><span class="d">${dur(y[0])}${sv(p,y)>0?`<em>وفّر ${sv(p,y)}%</em>`:''}</span><b>${fmt(y[1])}</b></button>`).join('')}<h2 class="sh">كيف يتم طلبك؟</h2>${STEPS.map((s,i)=>`<div class="stp"><i>${i+1}</i><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join('')}<h2 class="sh">الأسئلة الشائعة</h2>${faqH}</div><div class="bar"><button class="btn o" onclick="add('${p.id}',${x[0]})">أضف للسلة</button><button class="btn" onclick="add('${p.id}',${x[0]},1)">اشترِ الآن · ${fmt(x[1])}</button></div>`};
const cartV=()=>{if(!cart.length)return`<div class="w em"><div>🛒</div><h2>سلتك فارغة</h2><p class="note" style="margin-bottom:18px">اختر اشتراكك الأول وابدأ المشاهدة اليوم</p><a class="btn" href="#/shop">تصفّح الاشتراكات</a></div>`;
const sv2=saved();
return`<div class="w"><h1 class="ttl">سلة التسوق</h1>${cart.map((i,k)=>{const p=pr(i.id),x=pl(i);return`<div class="ci"><i class="ic" style="background:${p.c}">${p.l}</i><div class="in"><b>${p.t}</b><select class="sel" onchange="chg(${k},+this.value)">${p.pl.map(y=>`<option value="${y[0]}" ${y[0]==i.m?'selected':''}>${dur(y[0])} — ${y[1]} DA</option>`).join('')}</select><div class="q"><button onclick="qty(${k},-1)">−</button><span>${i.q}</span><button onclick="qty(${k},1)">+</button></div></div><div class="cr"><button class="x" onclick="del(${k})">✕</button><b>${fmt(x[1]*i.q)}</b></div></div>`}).join('')}<div class="sm"><h3>ملخص الطلب</h3><div><span>عدد الاشتراكات</span><b>${cart.reduce((s,i)=>s+i.q,0)}</b></div>${sv2>0?`<div class="gr"><span>توفيرك</span>${fmt(sv2)}</div>`:''}<hr><div class="tt"><span>الإجمالي</span>${fmt(tot())}</div></div><a class="btn" href="#/checkout">أكمل الطلب</a></div>`};

const pbox=()=>{
  const m=PAY.find(x=>x.id==payId);
  if(m.auto){
    return `💳 <b>الدفع التلقائي الفوري عبر Chargily Pay</b><p style="margin-top:6px">${m.desc}</p>${chargilyMode==='test'?'<span style="display:inline-block;margin-top:6px;background:#F59E0B;color:#fff;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:800">وضع التجربة مفعل (Test Mode)</span>':''}`;
  }
  return `حوّل المبلغ إلى ${m.k}:<b>${m.v}</b><button class="cp" onclick="cp('${m.v}')">${ico(I.copy)} نسخ الرقم</button>`;
};

const chk=()=>!cart.length?cartV():`<div class="w"><h1 class="ttl">إتمام الطلب</h1><div class="sm">${cart.map(i=>`<div><span>${pr(i.id).t} · ${dur(pl(i)[0])} × ${i.q}</span>${fmt(pl(i)[1]*i.q)}</div>`).join('')}<hr><div class="tt"><span>الإجمالي</span>${fmt(tot())}</div></div><label class="lb" for="fn">الاسم الكامل</label><input class="in2" id="fn" autocomplete="name" value="${esc(me().n||'')}" placeholder="اكتب اسمك هنا" required><label class="lb" for="fp">رقم واتساب لاستلام الحساب</label><input class="in2" id="fp" type="tel" value="${esc(me().p||'')}" dir="ltr" autocomplete="tel" placeholder="05XX XX XX XX" required><label class="lb">اختر طريقة الدفع</label><div class="pms">${PAY.map(m=>`<button class="pm ${m.auto?'full':''} ${m.id==payId?'on':''}" data-i="${m.id}" onclick="pick('${m.id}')">${m.auto?'⚡ ':''}${m.n}</button>`).join('')}</div><div class="box" id="pbox">${pbox()}</div><button class="btn" id="submitBtn" onclick="send()">${payId==='chargily'?'الدفع الآن عبر شارجيلي ⚡':'تأكيد وإنهاء الطلب'}</button></div>`;

const trackV = () => `<div class="w"><h1 class="ttl">تتبع طلبي</h1>
<div class="sm">
  <label class="lb">رمز الطلب</label>
  <input class="in2" id="tk_code" placeholder="OP-XXXXX" style="text-transform:uppercase" dir="ltr">
  <label class="lb">آخر 4 أرقام من رقم الهاتف</label>
  <input class="in2" id="tk_ph" type="tel" maxlength="4" placeholder="مثال: 1234" dir="ltr">
  <button class="btn" onclick="trackOrder()">بحث عن الطلب</button>
</div>
<div id="tk_res" style="margin-top:16px"></div>
</div>`;

window.trackOrder = async () => {
  const c = $('#tk_code').value.trim().toUpperCase(), p = $('#tk_ph').value.trim();
  if(!c || p.length !== 4) return toast('تأكد من إدخال الرمز و 4 أرقام من الهاتف');
  $('#tk_res').innerHTML = '<p class="note">جارٍ البحث...</p>';
  try {
    const r = await fetch(`${API_BASE}/api/account/track?code=${c}&phone4=${p}`);
    const d = await r.json();
    if(!d.success) throw new Error(d.message);
    const t = d.tracking;
    $('#tk_res').innerHTML = `<div class="sm">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
         <b style="font-size:16px">${esc(t.orderCode)}</b>
         <span class="bg" style="background:${COL[t.status]||'#888'};color:#fff;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:bold">${esc(t.status)}</span>
      </div>
      <div class="note" style="text-align:start">${new Date(t.createdAt).toLocaleString('fr-DZ')}</div>
      <hr>
      <ul style="padding-inline-start:20px;font-size:14px;color:var(--mut);line-height:1.8">${t.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
      <hr>
      <div class="tt"><span>الإجمالي</span>${fmt(t.totalPrice)}</div>
    </div>`;
  } catch(e) {
    $('#tk_res').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
};

const doneV=()=>{
  if(!ord.code) return home();
  return `<div class="w em"><div class="okc">✓</div><h2>شكرًا ${esc(ord.n||'لك')}، استلمنا طلبك 🎉</h2><p class="note" style="margin:0 0 4px">رقم طلبك: <b>${esc(ord.code)}</b></p><p class="note" id="paidStatusNote">${ord.paid?'✅ تم تأكيد دفعك الإلكتروني عبر Chargily Pay بنجاح!':'أرسل صورة وصل الدفع عبر تيليغرام أو واتساب لتأكيد طلبك فوراً.'}</p>${msg?`<pre>${esc(msg)}</pre>`:''}${CFG.tg?`<a class="btn tg" target="_blank" rel="noopener" href="https://t.me/${CFG.tg}?start=${encodeURIComponent(ord.code)}">متابعة الطلب عبر تيليغرام</a>`:''}${CFG.wa?`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${CFG.wa}?text=${encodeURIComponent(msg||('مرحباً، قمت بدفع الطلب رقم '+ord.code))}">مراسلتنا عبر واتساب</a>`:''}<a class="lk" href="#/shop">العودة للمتجر</a></div>`;
};

function view(){
  const rawHash = location.hash.slice(2);
  const [pathPart, queryPart] = rawHash.split('?');
  const h = (pathPart || 'home').split('/');
  const v = h[0] || 'home';

  if (v === 'done' && queryPart) {
    const params = new URLSearchParams(queryPart);
    const orderFromUrl = params.get('order');
    if (orderFromUrl) {
      ord.code = orderFromUrl;
      ord.paid = params.get('paid') === '1';
      cart = []; save();
      fetch(`${API_URL}/verify-chargily/${encodeURIComponent(orderFromUrl)}`, { method: 'POST' })
        .then(r => r.json())
        .then(d => {
          const el = $('#paidStatusNote');
          if (el && d.paid) el.textContent = '✅ تم تأكيد الدفع الإلكتروني تلقائياً عبر Chargily Pay!';
        }).catch(()=>{});
    }
  }

  document.body.className=v=='p'&&pr(h[1])?'pp':'';
  if(v=='p'&&pr(h[1]))return prod(pr(h[1]));
  return v=='shop'?shop():v=='cart'?cartV():v=='checkout'?chk():v=='done'?doneV():v=='track'?trackV():home();
}

function chrome(){const h=location.hash.slice(2).split('?')[0].split('/'),v=h[0]||'home',n=cart.reduce((s,i)=>s+i.q,0);
 $('#hd').innerHTML=`${v!='home'?`<button class="ib" onclick="back()" aria-label="رجوع">${ico(I.back)}</button>`:''}<a class="logo" href="#/"><i>▶</i>OVIRA <b>PLAY</b></a><button class="ib" onclick="theme()" aria-label="تغيير المظهر">${ico(I.moon)}</button><a class="ib" href="#/cart" aria-label="السلة">${ico(I.cart)}${n?`<span class="cnt">${n}</span>`:''}</a>`;
 const t=[['home','الرئيسية','/'],['shop','المتجر','/shop'],['track','تتبع','/track'],['cart','السلة','/cart']];
 $('#nv').innerHTML=t.map(x=>`<a href="#${x[2]}" class="${x[0]==v||(x[0]=='cart'&&v=='checkout')?'on':''}">${ico(I[x[0]])}${x[1]}${x[0]=='cart'&&n?`<span class="cnt" style="inset-inline-start:calc(50% + 4px)">${n}</span>`:''}</a>`).join('')}
function draw(){clean();app.innerHTML=view();chrome()}
function route(){const h=location.hash.slice(2).split('?')[0].split('/');if(h[0]=='p'&&pr(h[1]))sel=Math.max(0,pr(h[1]).pl.findIndex(x=>x[2]));draw();scrollTo(0,0)}
function back(){history.length>1?history.back():location.hash='#/'}
function setCat(c){cat=c;draw()}
function pickPlan(i){sel=i;draw()}
function add(id,m,go){const e=cart.find(i=>i.id==id&&i.m==m);if(e)e.q=Math.min(9,e.q+1);else cart.push({id,m,q:1});save();if(go)location.hash='#/checkout';else{draw();toast('تمت الإضافة إلى السلة ✓')}}
function qty(k,d){cart[k].q=Math.min(9,Math.max(1,cart[k].q+d));save();draw()}
function del(k){cart.splice(k,1);save();draw();toast('تم حذف الاشتراك')}
function pick(id){payId=id;document.querySelectorAll('.pm').forEach(b=>b.classList.toggle('on',b.dataset.i==id));$('#pbox').innerHTML=pbox();const sb=$('#submitBtn');if(sb)sb.textContent=id==='chargily'?'الدفع الآن عبر شارجيلي ⚡':'تأكيد وإنهاء الطلب'}

async function send(){
 const n=$('#fn').value.trim(),ph=normPh($('#fp').value);
 if(n.length<3){$('#fn').focus();return toast('اكتب اسمك الكامل')}
 if(!/^0[567]\d{8}$/.test(ph)){$('#fp').focus();return toast('أدخل رقم هاتف جزائري صحيح من 10 أرقام')}
 const pm=PAY.find(x=>x.id==payId);
 const submitBtn = $('#submitBtn');
 submitBtn.disabled = true;
 submitBtn.textContent = 'جاري معالجة الطلب...';

 const returnOrigin = location.origin + location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
 const payload = {
   customerName: n,
   whatsappNumber: ph,
   paymentMethod: pm.n,
   totalPrice: tot(),
   cartItems: cart.map(i => ({ id: i.id, m: i.m, q: i.q })),
   returnOrigin
 };

 try {
   const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
   const data = await response.json();
   if (data.success) {
      const code = data.order.orderCode;
      msg=['🧾 طلب جديد — OVIRA PLAY','رقم الطلب: '+code,'👤 الاسم: '+n,'📱 الهاتف: '+ph,'','🛒 الطلبات:',...cart.map((i,k)=>(k+1)+') '+pr(i.id).t+' ('+dur(pl(i)[0])+' × '+i.q+')'),'💰 الإجمالي: '+tot()+' DA','💳 طريقة الدفع: '+pm.n].join('\n');
      ord={code,n:n.split(' ')[0],ids:cart.map(i=>pr(i.id).n), claimToken: data.claimToken};
      try{localStorage.setItem('oi',JSON.stringify({n,p:ph}))}catch(e){}

      // إذا كان الدفع عبر شارجيلي، نحوله فوراً لبوابة الدفع
      if (data.checkoutUrl) {
        location.href = data.checkoutUrl;
        return;
      }

      cart=[];save();location.hash='#/done';
   } else {
       toast(data.message || 'حدث خطأ أثناء معالجة الطلب.');
       submitBtn.disabled = false; submitBtn.textContent = 'تأكيد وإنهاء الطلب';
   }
 } catch (error) {
     toast('حدث خطأ في الاتصال بالخادم.');
     submitBtn.disabled = false; submitBtn.textContent = 'تأكيد وإنهاء الطلب';
 }
}

if(CFG.wa){const f=$('#fab');f.href='https://wa.me/'+CFG.wa;f.style.display='grid'}
let ord={n:'',code:'',ids:[], claimToken:'', paid:false};
const me=()=>{try{return JSON.parse(localStorage.getItem('oi')||'{}')}catch(e){return{}}};
const normPh=s=>s.replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[\s\-().]/g,'').replace(/^(\+|00)?213/,'0');
const saved=()=>cart.reduce((s,i)=>s+(pr(i.id).pl[0][1]*pl(i)[0]-pl(i)[1])*i.q,0);
function chg(k,m){cart[k].m=m;save();draw()}
addEventListener('hashchange',route);route();
</script>
</body>
</html>

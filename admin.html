<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OVIRA PLAY | لوحة التحكم الرئيسية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F7FB;
  --card: #FFFFFF;
  --ink: #0F172A;
  --mut: #64748B;
  --line: #E2E8F0;
  --sidebar: #0B1120;
  --sidebar-hover: #172036;
  --pri: #4F46E5;
  --pri2: #3B82F6;
  --ok: #10B981;
  --bad: #EF4444;
  --warn: #F59E0B;
  --purp: #8B5CF6;
  --sh: 0 4px 20px rgba(15, 23, 42, 0.04);
  --radius: 16px;
}

[data-theme="dark"] {
  --bg: #070B14;
  --card: #111827;
  --ink: #F8FAFC;
  --mut: #94A3B8;
  --line: #1E293B;
  --sh: 0 4px 20px rgba(0, 0, 0, 0.35);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html[lang="ar"] body {
  font-family: 'Cairo', system-ui, -apple-system, sans-serif;
}
html[lang="en"] body {
  font-family: 'Inter', 'Cairo', system-ui, -apple-system, sans-serif;
}

body {
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
}
a {
  color: inherit;
  text-decoration: none;
}

.app-shell {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

.sidebar {
  width: 260px;
  background: var(--sidebar);
  color: #E2E8F0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 50;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  scrollbar-width: thin;
}

.sidebar-brand {
  padding: 20px 18px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.ovira-logo {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  user-select: none;
  direction: ltr;
}
.ovira-logo svg {
  height: 54px;
  width: auto;
  display: block;
}
.ovira-logo.sm svg {
  height: 38px;
}

.nav-list {
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 700;
  color: #94A3B8;
  transition: all 0.2s;
  width: 100%;
  text-align: start;
}
.nav-item svg.ic {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  opacity: 0.85;
}
.nav-item .chev {
  margin-inline-start: auto;
  width: 14px;
  height: 14px;
  opacity: 0.45;
  transition: transform 0.2s;
}
html[dir="ltr"] .nav-item .chev {
  transform: rotate(180deg);
}
.nav-item:hover {
  background: var(--sidebar-hover);
  color: #FFFFFF;
}
.nav-item.active {
  background: linear-gradient(90deg, #4F46E5 0%, #3B82F6 100%);
  color: #FFFFFF;
  box-shadow: 0 6px 18px rgba(59, 130, 246, 0.32);
}
.nav-item.active svg.ic,
.nav-item.active .chev {
  opacity: 1;
}

.sidebar-footer {
  padding: 16px 18px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  color: #64748B;
}
.sidebar-footer b {
  color: #E2E8F0;
  display: block;
  font-size: 12.5px;
}

.main-area {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.top-header {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 30;
}

.header-search {
  position: relative;
  flex: 1;
  max-width: 420px;
}
.header-search input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 9px 16px;
  padding-inline-start: 38px;
  font-size: 13px;
  font-weight: 600;
  outline: none;
  transition: border-color 0.2s;
}
.header-search input:focus {
  border-color: var(--pri2);
}
.header-search svg {
  position: absolute;
  inset-inline-start: 13px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--mut);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  position: relative;
  color: var(--mut);
  transition: all 0.2s;
}
.icon-btn:hover {
  color: var(--ink);
  border-color: var(--pri2);
}
.icon-btn .dot-badge {
  position: absolute;
  top: -2px;
  inset-inline-end: -2px;
  background: var(--bad);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 2px solid var(--card);
}

.lang-btn {
  padding: 6px 12px;
  border-radius: 20px;
  background: var(--bg);
  border: 1px solid var(--line);
  font-size: 12px;
  font-weight: 800;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.lang-btn:hover {
  border-color: var(--pri2);
  color: var(--pri2);
}

.profile-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-inline-end: 12px;
  border-inline-end: 1px solid var(--line);
}
.profile-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1E293B, #3B82F6);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 14px;
  overflow: hidden;
}
.profile-info {
  line-height: 1.25;
}
.profile-info b {
  display: block;
  font-size: 13px;
  font-weight: 800;
}
.profile-info small {
  font-size: 11px;
  color: var(--mut);
  font-weight: 600;
}

.menu-toggle {
  display: none;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  place-items: center;
}

.content-wrap {
  padding: 20px 24px 40px;
  max-width: 1600px;
  width: 100%;
  margin: 0 auto;
}

.sub-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 18px;
}
.page-title h1 {
  font-size: 22px;
  font-weight: 900;
  color: var(--ink);
  line-height: 1.2;
}
.page-title p {
  font-size: 12.5px;
  color: var(--mut);
  font-weight: 600;
  margin-top: 2px;
}

.filters-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.period-tabs {
  display: inline-flex;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 3px;
  gap: 2px;
}
.period-tab {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--mut);
  transition: all 0.15s;
}
.period-tab.active {
  background: var(--pri2);
  color: #fff;
}

.date-picker-box {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--line);
  padding: 7px 14px;
  border-radius: 11px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
}

.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 16px;
}

.kpi-card {
  border-radius: var(--radius);
  padding: 16px 18px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  box-shadow: var(--sh);
}
.kpi-card.sales {
  background: linear-gradient(135deg, #FFF5F5 0%, #FFE4E6 100%);
  border-color: #FECDD3;
}
.kpi-card.revenue {
  background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%);
  border-color: #BAE6FD;
}
.kpi-card.profit {
  background: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 100%);
  border-color: #DDD6FE;
}
.kpi-card.net {
  background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
  border-color: #A7F3D0;
}
[data-theme="dark"] .kpi-card.sales { background: linear-gradient(135deg, rgba(244,63,94,0.14), rgba(244,63,94,0.05)); border-color: rgba(244,63,94,0.25); }
[data-theme="dark"] .kpi-card.revenue { background: linear-gradient(135deg, rgba(59,130,246,0.14), rgba(59,130,246,0.05)); border-color: rgba(59,130,246,0.25); }
[data-theme="dark"] .kpi-card.profit { background: linear-gradient(135deg, rgba(139,92,246,0.14), rgba(139,92,246,0.05)); border-color: rgba(139,92,246,0.25); }
[data-theme="dark"] .kpi-card.net { background: linear-gradient(135deg, rgba(16,185,129,0.14), rgba(16,185,129,0.05)); border-color: rgba(16,185,129,0.25); }

.kpi-main {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.kpi-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.kpi-badge-ico {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
}
.kpi-card.sales .kpi-badge-ico { background: rgba(239,68,68,0.12); color: #E11D48; }
.kpi-card.revenue .kpi-badge-ico { background: rgba(59,130,246,0.12); color: #2563EB; }
.kpi-card.profit .kpi-badge-ico { background: rgba(139,92,246,0.12); color: #7C3AED; }
.kpi-card.net .kpi-badge-ico { background: rgba(16,185,129,0.12); color: #059669; }

.kpi-title {
  font-size: 13px;
  font-weight: 800;
}
.kpi-card.sales .kpi-title { color: #BE123C; }
.kpi-card.revenue .kpi-title { color: #1D4ED8; }
.kpi-card.profit .kpi-title { color: #6D28D9; }
.kpi-card.net .kpi-title { color: #047857; }
[data-theme="dark"] .kpi-title { color: #E2E8F0 !important; }

.kpi-val {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.3px;
  margin-top: 4px;
}
.kpi-card.sales .kpi-val { color: #9F1239; }
.kpi-card.revenue .kpi-val { color: #1E40AF; }
.kpi-card.profit .kpi-val { color: #5B21B6; }
.kpi-card.net .kpi-val { color: #065F46; }
[data-theme="dark"] .kpi-val { color: #FFFFFF !important; }

.kpi-trend {
  font-size: 12px;
  font-weight: 800;
  color: #16A34A;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.kpi-side-ico {
  font-size: 26px;
  opacity: 0.85;
}

.dash-body-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 14px;
  align-items: start;
}

.dash-main-col {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

.dash-side-col {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

.w-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--sh);
}

.w-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}
.w-head h3 {
  font-size: 14.5px;
  font-weight: 800;
  color: var(--ink);
}

.stats4-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.detail-stat-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
}
.detail-stat-ico {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
}
.detail-stat-num {
  font-size: 25px;
  font-weight: 900;
  line-height: 1.1;
  margin-top: 2px;
}
.detail-stat-list {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.detail-stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  color: var(--mut);
}
.detail-stat-row b {
  color: var(--ink);
  font-weight: 800;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-inline-end: 6px;
}

.charts3-grid {
  display: grid;
  grid-template-columns: 1.55fr 1.15fr 1fr;
  gap: 14px;
}

.chart-tabs {
  display: inline-flex;
  background: var(--bg);
  border-radius: 8px;
  padding: 2px;
  gap: 2px;
}
.chart-tab {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  color: var(--mut);
}
.chart-tab.active {
  background: #6366F1;
  color: #fff;
}

.donut-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 6px;
}
.donut-svg-box {
  position: relative;
  width: 142px;
  height: 142px;
  flex-shrink: 0;
}
.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
}
.donut-center b {
  font-size: 14px;
  font-weight: 900;
}
.donut-center small {
  font-size: 10.5px;
  color: var(--mut);
  font-weight: 700;
}
.donut-legend {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.legend-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
}
.legend-name {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--mut);
}

.top-prod-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 6px;
}
.top-prod-row {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  font-weight: 800;
}
.prod-brand-ico {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 900;
  font-size: 12px;
  flex-shrink: 0;
}
.prod-bar-track {
  flex: 1;
  height: 6px;
  background: var(--bg);
  border-radius: 6px;
  overflow: hidden;
}
.prod-bar-fill {
  height: 100%;
  border-radius: 6px;
}

.tables3-grid {
  display: grid;
  grid-template-columns: 0.78fr 1.45fr 1fr;
  gap: 14px;
}

.table-scroll {
  width: 100%;
  overflow-x: auto;
}
.clean-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  white-space: nowrap;
}
.clean-table th {
  text-align: start;
  padding: 8px 8px;
  color: var(--mut);
  font-weight: 700;
  border-bottom: 1px solid var(--line);
  background: rgba(241, 245, 249, 0.5);
}
[data-theme="dark"] .clean-table th {
  background: rgba(30, 41, 59, 0.4);
}
.clean-table td {
  padding: 9px 8px;
  border-bottom: 1px solid var(--line);
  font-weight: 700;
}
.clean-table tr:last-child td {
  border-bottom: 0;
}

.st-pill {
  padding: 2px 9px;
  border-radius: 12px;
  font-size: 10.5px;
  font-weight: 800;
  display: inline-block;
}
.st-pill.ok { background: #DCFCE7; color: #15803D; }
.st-pill.warn { background: #FEF3C7; color: #B45309; }
.st-pill.pri { background: #DBEAFE; color: #1D4ED8; }
.st-pill.bad { background: #FEE2E2; color: #B91C1C; }

.cust-cell {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.mini-av {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #E2E8F0;
  color: #1E293B;
  display: inline-grid;
  place-items: center;
  font-size: 10px;
  font-weight: 900;
  flex-shrink: 0;
}

.bottom4-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.mini-high-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  box-shadow: var(--sh);
}

.notif-list {
  display: flex;
  flex-direction: column;
}
.notif-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.notif-item:last-child {
  border-bottom: 0;
  padding-bottom: 2px;
}
.notif-ico {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-size: 13px;
}
.notif-text b {
  display: block;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.35;
}
.notif-text small {
  color: var(--mut);
  font-size: 11px;
  font-weight: 600;
}

.fin-rows {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 8px;
}
.fin-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--mut);
}
.fin-row b {
  color: var(--ink);
  font-weight: 900;
  font-size: 13.5px;
}
.fin-bar {
  height: 6px;
  border-radius: 6px;
  background: var(--bg);
  overflow: hidden;
  margin: 4px 0;
}
.fin-bar > div {
  height: 100%;
  width: 68%;
  background: linear-gradient(90deg, #10B981, #3B82F6);
  border-radius: 6px;
}

.promo-card {
  background: radial-gradient(circle at 80% 20%, #1E293B 0%, #090D16 100%);
  border-radius: var(--radius);
  padding: 18px;
  color: #FFFFFF;
  position: relative;
  overflow: hidden;
  min-height: 185px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border: 1px solid rgba(255,255,255,0.08);
}
.promo-floating-icons {
  position: relative;
  height: 95px;
}
.fl-ico {
  position: absolute;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-weight: 900;
  color: #fff;
  box-shadow: 0 8px 20px rgba(0,0,0,0.45);
}
.promo-btn {
  align-self: flex-start;
  background: linear-gradient(90deg, #4F46E5, #3B82F6);
  color: #fff;
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
}

.section-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--sh);
}
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 10px;
  scrollbar-width: none;
}
.chip {
  padding: 7px 14px;
  border-radius: 18px;

async function doLogin() {
  const email = document.getElementById('em').value.trim();
  const password = document.getElementById('pw').value;
  if (!email || !password) return renderLogin(lang === 'ar' ? 'أدخل البريد الإلكتروني وكلمة السر' : 'Enter email and password');
  try {
    const r = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const d = await r.json();
    if (!d.success) return renderLogin(d.message || 'بيانات الدخول غير صحيحة.');
    token = d.token;
    adminRole = d.role || 'owner';
    isDemoMode = false;
    localStorage.removeItem('adm_demo');
    localStorage.setItem('adm_tk', token);
    localStorage.setItem('adm_role', adminRole);
    loadPanel();
  } catch (e) {
    renderLogin('تعذّر الاتصال بالخادم');
  }
}

function logout() {
  token = '';
  isDemoMode = false;
  localStorage.removeItem('adm_tk');
  localStorage.removeItem('adm_demo');
  renderLogin();
}

function buildQueryParams() {
  const params = new URLSearchParams();
  params.set('page', curPage);
  if (stFilter) params.set('status', stFilter);
  if (spFilter) params.set('special', spFilter);
  if (qFilter) params.set('q', qFilter);
  if (daysFilter > 0) {
    params.set('from', new Date(Date.now() - daysFilter * 864e5).toISOString());
  }
  return params;
}

async function apiGet(path) {
  const r = await fetch(API + path, { headers: { 'Authorization': 'Bearer ' + token } });
  if (r.status === 401) { logout(); throw new Error('UNAUTHORIZED'); }
  return r.json();
}

async function loadPanel() {
  if (!token && !isDemoMode) return renderLogin();
  if (isDemoMode) {
    renderApp();
    return;
  }
  try {
    if (activeNav === 'dashboard') {
      const [ord, st, ren, stk, cust] = await Promise.all([
        apiGet('/orders?page=1').catch(() => ({ orders: [] })),
        apiGet('/stats').catch(() => ({})),
        apiGet('/renewals').catch(() => ({})),
        apiGet('/stock').catch(() => ({})),
        apiGet('/customers').catch(() => ({ customers: [] }))
      ]);
      store.ordersData = ord;
      store.statsData = st;
      store.renewalsData = ren;
      store.stockData = stk;
      store.manageData.customers = cust.customers || [];
    } else if (activeNav === 'orders' || activeNav === 'support') {
      store.ordersData = await apiGet('/orders?' + buildQueryParams().toString());
    } else if (activeNav === 'stock' || activeNav === 'products') {
      store.stockData = await apiGet('/stock' + (stockProdFilter ? '?productId=' + stockProdFilter : ''));
    } else if (activeNav === 'renewals') {
      store.renewalsData = await apiGet('/renewals');
    } else if (activeNav === 'finance' || activeNav === 'reports' || activeNav === 'partners') {
      store.statsData = await apiGet('/stats');
    } else {
      const [cust, coup, aud] = await Promise.all([
        apiGet('/customers'),
        apiGet('/coupons'),
        apiGet('/audit')
      ]);
      store.manageData = {
        customers: cust.customers || [],
        coupons: coup.coupons || [],
        audits: aud.audits || [],
        admins: aud.admins || []
      };
    }
    renderApp();
  } catch (e) {
    if (e.message !== 'UNAUTHORIZED') renderApp();
  }
}

function switchNav(id) {
  activeNav = id;
  toggleMobileSidebar(false);
  loadPanel();
}

function waLink(phone, text) {
  const p = String(phone || '').replace(/^0/, '213');
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}

function smartWaText(o) {
  if (o.status === 'تم التسليم' && o.delivery && o.delivery.credentials) {
    return `مرحباً ${o.customerName} 🌟\nتم تفعيل طلبك رقم (${o.orderCode}) في OVIRA PLAY بنجاح!\n\nتفاصيل اشتراكك:\n${o.delivery.credentials}\n\nشكراً لثقتك بنا!`;
  }
  if (o.status === 'مؤكد') {
    return `مرحباً ${o.customerName}، تم تأكيد دفعتك للطلب (${o.orderCode}) وجاري إرسال بيانات الحساب لك خلال لحظات.`;
  }
  return `مرحباً ${o.customerName}، بخصوص طلبك رقم (${o.orderCode}) بقيمة ${o.totalPrice} DA في OVIRA PLAY، يرجى إرسال صورة وصل الدفع لتأكيد الطلب.`;
}

    const a = avail[id] || { availableSlots: 4, totalSlots: 5, accountsCount: 1 };

    const occ = (st.slots || []).filter(s => s.status === 'occupied').length;
    const tot = (st.slots || []).length;
    const masterDaysLeft = Math.ceil((new Date(st.masterExpiresAt) - Date.now()) / 86400000);

    const slotsBoxes = (st.slots || []).map(sl => `

async function upStatus(id, status) {
  if (isDemoMode) {
    const item = REF_ORDERS.find(x => x._id === id);
    if (item) item.status = status;
    renderApp();
    return;
  }
  await fetch(`${API}/orders/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ status })
  });
  loadPanel();
}

  await fetch(`${API}/orders/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },

async function deliverAuto(id) {
  if (!confirm('هل تريد سحب شاشة متاحة من المخزون وتسليمها للعميل تلقائياً؟')) return;
  const r = await fetch(`${API}/orders/${id}/deliver`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ mode: 'auto' })
  });
  const d = await r.json();
  if (!d.success) return alert(d.message || 'فشل التسليم التلقائي');
  alert('✅ تم سحب الشاشة من المخزون وإرسالها للعميل!');
  loadPanel();
}

    <input class="inp" id="es_pw" dir="ltr" value="${pass}">
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;font-weight:800">
      <input type="checkbox" id="es_nt" checked> إرسال إشعار فوري لجميع العملاء المشتركين في هذا الحساب على تيليغرام وتحديث صفحتهم
    </label>
    <button class="btn-pri" onclick="submitEditStock('${id}')">حفظ وتحديث</button>
  `);
}

async function submitEditStock(id) {
  const email = document.getElementById('es_em').value.trim();
  const password = document.getElementById('es_pw').value.trim();
  const notifyCustomers = document.getElementById('es_nt').checked;
  const r = await fetch(`${API}/stock/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ email, password, notifyCustomers })
  });
  const d = await r.json();
  if (!d.success) return alert(d.message);
  closeMdl();
  alert(`✅ تم التحديث وإشعار ${d.notifiedCount || 0} عميل.`);
  loadPanel();
}

async function freeSlot(stockId, slotNumber) {
  if (!confirm('هل تريد إخلاء هذه الشاشة وتوليد رمز PIN عشوائي جديد لها لتصبح متاحة للبيع؟')) return;
  const r = await fetch(`${API}/stock/${stockId}/slots/${slotNumber}/release`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ rotatePin: true })
  });
  const d = await r.json();
  if (!d.success) return alert(d.message);
  alert(`🔓 تم إخلاء الشاشة! رمز الـ PIN الجديد هو: ${d.slot.pin || 'بدون PIN'}`);
  loadPanel();
}

async function delStock(id) {
  if (!confirm('حذف هذا الحساب الأم نهائياً؟')) return;
  await fetch(`${API}/stock/${id}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
  loadPanel();
}

function openCouponModal() {
  openMdl(`
    <h3>🎟️ إنشاء كوبون خصم</h3>
    <label class="lbl">رمز الكوبون (مثال: OVIRA10)</label>
    <input class="inp" id="cp_code" dir="ltr" style="text-transform:uppercase">
    <label class="lbl">نوع الخصم</label>
    <select class="inp" id="cp_type"><option value="fixed">مبلغ ثابت (DA)</option><option value="percent">نسبة مئوية (%)</option></select>
    <label class="lbl">قيمة الخصم</label>
    <input class="inp" id="cp_val" type="number" placeholder="200">
    <label class="lbl">الحد الأقصى للاستخدام</label>
    <input class="inp" id="cp_max" type="number" value="100">
    <button class="btn-pri" onclick="submitCoupon()">حفظ الكوبون</button>
  `);
}

async function submitCoupon() {
  const body = {
    code: document.getElementById('cp_code').value.trim(),
    type: document.getElementById('cp_type').value,
    value: Number(document.getElementById('cp_val').value),
    maxUses: Number(document.getElementById('cp_max').value)
  };
  const r = await fetch(`${API}/coupons`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (!d.success) return alert(d.message);
  closeMdl();
  loadPanel();
}

async function delCoupon(id) {
  await fetch(`${API}/coupons/${id}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
  loadPanel();
}

async function editCustomerBalance(id, name, cur) {
  const val = prompt(`أدخل رصيد المحفظة الجديد للعميل (${name}) بالدينار:`, cur);
  if (val === null) return;
  await fetch(`${API}/customers/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ balance: Number(val) })
  });
  loadPanel();
}

async function toggleBlockCustomer(id, blocked) {
  await fetch(`${API}/customers/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ blocked })
  });
  loadPanel();
}

function openStaffModal() {
  openMdl(`
    <h3>🛡️ إضافة / تحديث مشرف</h3>
    <label class="lbl">الاسم</label>
    <input class="inp" id="sf_name" placeholder="اسم المشرف">
    <label class="lbl">معرف تيليغرام الرقمي (Telegram ID)</label>
    <input class="inp" id="sf_tg" type="number" dir="ltr" placeholder="123456789">
    <label class="lbl">الصلاحية</label>
    <select class="inp" id="sf_role"><option value="staff">مشرف طلبات ومخزون (staff)</option><option value="viewer">مشاهد فقط (viewer)</option><option value="owner">مالك كامل الصلاحية (owner)</option></select>
    <label class="lbl">البريد الإلكتروني للدخول للوحة (اختياري)</label>
    <input class="inp" id="sf_em" dir="ltr">
    <label class="lbl">كلمة السر للدخول للوحة (اختياري)</label>
    <input class="inp" id="sf_pw" type="password" dir="ltr">
    <button class="btn-pri" onclick="submitStaff()">حفظ المشرف</button>
  `);
}

async function submitStaff() {
  const body = {
    name: document.getElementById('sf_name').value.trim(),
    telegramId: Number(document.getElementById('sf_tg').value),
    role: document.getElementById('sf_role').value,
    email: document.getElementById('sf_em').value.trim(),
    password: document.getElementById('sf_pw').value
  };
  const r = await fetch(`${API}/staff`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (!d.success) return alert(d.message);
  closeMdl();
  loadPanel();
}

async function dlCsv() {
  const r = await fetch(`${API}/export?${buildQueryParams().toString()}`, {
    headers: { 'Authorization': 'Bearer ' + token }
  });
  if (!r.ok) return alert('غير مصرح أو فشل التحميل');
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ovira_orders.csv';
  a.click();
}

loadPanel();
</script>
</body>

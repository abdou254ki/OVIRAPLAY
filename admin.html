<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة المحمية | OVIRA PLAY</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5FA;--card:#fff;--ink:#0D1530;--mut:#66708A;--line:#E2E6F0;--pri:#12286E;--pri2:#1E40AF;--ok:#16A34A;--bad:#EF4444;--warn:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--ink);padding:16px;max-width:760px;margin:0 auto}
button{cursor:pointer;border:0;background:none;font:inherit}
input,select{font:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(13,21,48,.05)}
.login-box{max-width:400px;margin:70px auto;text-align:center;padding:32px 24px}
.login-box h1{font-size:26px;font-weight:900}
.login-box p{color:var(--mut);font-size:13px;font-weight:700;margin-bottom:20px}
.lbl{display:block;text-align:start;font-size:13px;font-weight:800;color:var(--mut);margin:12px 0 6px}
.inp{width:100%;background:#F8FAFC;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;color:var(--ink)}
.btn-pri{width:100%;background:var(--pri2);color:#fff;padding:13px;border-radius:14px;font-weight:800;font-size:15px;margin-top:16px}
.btn-bad{width:100%;background:var(--bad);color:#fff;padding:12px;border-radius:14px;font-weight:800;font-size:14px;margin-top:10px}
.err-msg{color:var(--bad);font-size:13px;font-weight:700;margin-top:12px}
.ok-msg{color:var(--ok);font-size:13px;font-weight:700;margin-top:12px}
.top-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.top-bar h2{margin-inline-start:auto;font-size:19px;font-weight:900}
.btn-sm{background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:12px;font-weight:800;font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);padding:6px;border-radius:18px;border:1px solid var(--line);margin-bottom:14px;gap:4px}
.tab{padding:10px;border-radius:13px;font-weight:800;font-size:13px;color:var(--mut)}
.tab.on{background:var(--pri2);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chip{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:12px;white-space:nowrap}
.chip.on{background:var(--pri2);color:#fff;border-color:transparent}
.search-row{display:flex;gap:8px;margin-bottom:16px}
.ord-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.badge{padding:3px 10px;border-radius:20px;color:#fff;font-size:12px;font-weight:800}
.meta{font-size:12px;color:var(--mut);font-weight:700;margin-bottom:10px}
.cust{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:15px;margin-bottom:10px}
.cust a{color:var(--pri2);text-decoration:none;direction:ltr}
.items{background:#F8FAFC;padding:12px;border-radius:14px;font-weight:700;font-size:13px;margin-bottom:12px}
.tot-row{display:flex;justify-content:space-between;font-weight:900;font-size:15px;margin-bottom:12px}
.note-row{display:flex;gap:8px;margin-bottom:12px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act-btn{padding:9px 4px;border-radius:12px;font-weight:800;font-size:12px;border:2px solid var(--line)}
.act-btn.warn{border-color:var(--warn);color:#B45309}
.act-btn.pri{border-color:var(--pri2);color:var(--pri2)}
.act-btn.ok{border-color:var(--ok);color:var(--ok)}
.act-btn.bad{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const API = 'https://ovira-api.onrender.com/api/admin';
let token = sessionStorage.getItem('adm_tk') || '';
let tab = 'orders', stFilter = '', daysFilter = 0, qFilter = '';
const COL = {'قيد المراجعة':'#F59E0B','مؤكد':'#1E40AF','تم التسليم':'#16A34A','ملغي':'#EF4444'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');

function renderLogin(err = '') {
  document.getElementById('root').innerHTML = `
    <div class="card login-box">
      <h1>🔒 لوحة الإدارة</h1>
      <p>محمية بكلمة سر — OVIRA PLAY</p>
      <label class="lbl">البريد الإلكتروني</label>
      <input class="inp" id="em" type="email" dir="ltr" placeholder="admin@ovira">
      <label class="lbl">كلمة السر</label>
      <input class="inp" id="pw" type="password" dir="ltr" placeholder="••••••••">
      <button class="btn-pri" onclick="doLogin()">تسجيل الدخول</button>
      ${err ? `<div class="err-msg">${esc(err)}</div>` : ''}
    </div>`;
}

async function doLogin() {
  const email = document.getElementById('em').value.trim();
  const password = document.getElementById('pw').value;
  if (!email || !password) return renderLogin('أدخل البريد الإلكتروني وكلمة السر.');
  try {
    const r = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const d = await r.json();
    if (!r.ok || !d.success || !d.token) return renderLogin(d.message || 'بيانات الدخول غير صحيحة.');
    token = d.token;
    sessionStorage.setItem('adm_tk', token);
    loadPanel();
  } catch (e) {
    renderLogin('تعذّر الاتصال بالخادم، تأكد أن السيرفر يعمل.');
  }
}

function logout() {
  token = '';
  sessionStorage.removeItem('adm_tk');
  renderLogin();
}

async function loadPanel() {
  if (!token) return renderLogin();
  const params = new URLSearchParams();
  if (stFilter) params.set('status', stFilter);
  if (qFilter) params.set('q', qFilter);
  if (daysFilter > 0) params.set('from', new Date(Date.now() - daysFilter * 864e5).toISOString());

  const endpoint = tab === 'orders' ? 'orders?' + params.toString() : tab === 'stats' ? 'stats' : 'settings';
  try {
    const r = await fetch(`${API}/${endpoint}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (r.status === 401 || r.status === 403) return logout();
    const d = await r.json();
    if (!d.success) return logout();
    renderMain(d);
  } catch (e) {
    renderLogin('تعذّر الاتصال بالخادم.');
  }
}

function renderMain(d) {
  const statuses = ['', 'قيد المراجعة', 'مؤكد', 'تم التسليم', 'ملغي'];
  const times = [[0, 'كل الأوقات'], [1, 'اليوم'], [7, '7 أيام'], [30, '30 يومًا']];

  let content = '';
  if (tab === 'orders') {
    const list = (d.orders || []).map(o => `
      <div class="card">
        <div class="ord-head">
          <span class="badge" style="background:${COL[o.status] || '#666'}">${esc(o.status)}</span>
          <b style="font-size:16px">${esc(o.orderCode)} ${o.isPaidOnline ? '⚡' : ''}</b>
        </div>
        <div class="meta">
          ${o.repeat > 1 ? `🔁 عميل متكرر (${o.repeat}) · ` : ''}${new Date(o.createdAt).toLocaleString('en-GB')}
        </div>
        <div class="cust">
          <a href="https://wa.me/213${esc(o.whatsappNumber.slice(1))}" target="_blank">💬 ${esc(o.whatsappNumber)}</a>
          <span>${esc(o.customerName)}</span>
        </div>
        <div class="items">
          ${o.cartItems.map(i => `${esc(i.productName)} · ${i.months} شهر × ${i.quantity}`).join('<br>')}
        </div>
        <div class="tot-row">
          <span>${o.totalPrice} DA</span>
          <span style="color:var(--mut)">${esc(o.paymentMethod)}</span>
        </div>
        <div class="note-row">
          <button class="btn-sm" onclick="saveNote('${o._id}')">حفظ</button>
          <input class="inp" id="nt_${o._id}" value="${esc(o.adminNote || '')}" placeholder="ملاحظة داخلية..." style="padding:8px 12px">
        </div>
        <div class="actions">
          <button class="act-btn ok" onclick="upStatus('${o._id}','تم التسليم')">تم التسليم</button>
          <button class="act-btn pri" onclick="upStatus('${o._id}','مؤكد')">مؤكد</button>
          <button class="act-btn warn" onclick="upStatus('${o._id}','قيد المراجعة')">مراجعة</button>
          <button class="act-btn bad" onclick="upStatus('${o._id}','ملغي')">ملغي</button>
        </div>
      </div>`).join('');

    content = `
      <div class="chips">
        ${statuses.map(s => `<button class="chip ${stFilter === s ? 'on' : ''}" onclick="stFilter='${s}';loadPanel()">${s || 'كل الحالات'}</button>`).join('')}
      </div>
      <div class="chips">
        ${times.map(t => `<button class="chip ${daysFilter === t[0] ? 'on' : ''}" onclick="daysFilter=${t[0]};loadPanel()">${t[1]}</button>`).join('')}
      </div>
      <div class="search-row">
        <button class="btn-sm" onclick="dlCsv()">تصدير CSV</button>
        <input class="inp" placeholder="ابحث بالاسم أو الهاتف أو رمز الطلب" value="${esc(qFilter)}" onchange="qFilter=this.value;loadPanel()" style="padding:10px 14px">
      </div>
      ${list || '<div class="card" style="text-align:center">لا توجد طلبات حالياً — قاعدة البيانات نظيفة</div>'}`;
  } else if (tab === 'stats') {
    content = `<div class="card"><h3>إحصائيات الطلبات</h3><br>${(d.byStatus || []).map(s => `<p style="margin-bottom:8px"><b>${esc(s._id)}:</b> ${s.count} طلب (${s.sum} DA)</p>`).join('') || '<p>لا توجد بيانات بعد.</p>'}</div>`;
  } else if (tab === 'settings') {
    const ch = d.chargily || {};
    content = `
      <div class="card">
        <h3>⚡ إعدادات الدفع التلقائي (Chargily Pay V2)</h3>
        <label class="lbl">وضع التشغيل الحالي</label>
        <select class="inp" id="ch_mode">
          <option value="test" ${ch.mode === 'test' ? 'selected' : ''}>🧪 وضع التجربة (Test Mode)</option>
          <option value="live" ${ch.mode === 'live' ? 'selected' : ''}>🟢 الوضع الحقيقي (Live Mode)</option>
        </select>

        <label class="lbl">رابط الـ Webhook (انسخه وضعه في موقع شارجيلي)</label>
        <input class="inp" dir="ltr" readonly value="${esc(ch.webhookUrl || '')}" onclick="this.select()">

        <hr style="margin:18px 0;border:0;border-top:1px solid var(--line)">
        <h4>🧪 مفاتيح وضع التجربة (Test Keys)</h4>
        <label class="lbl">المفتاح العام التجريبي (Test Public Key)</label>
        <input class="inp" id="ch_tpk" dir="ltr" value="${esc(ch.testPublicKey || '')}">
        <label class="lbl">المفتاح السري التجريبي (Test Secret Key)</label>
        <input class="inp" id="ch_tsk" dir="ltr" value="${esc(ch.testSecretKey || '')}" placeholder="test_sk_...">

        <hr style="margin:18px 0;border:0;border-top:1px solid var(--line)">
        <h4>🟢 مفاتيح الوضع الحقيقي (Live Keys)</h4>
        <label class="lbl">المفتاح العام الحقيقي (Live Public Key)</label>
        <input class="inp" id="ch_lpk" dir="ltr" value="${esc(ch.livePublicKey || '')}" placeholder="live_pk_...">
        <label class="lbl">المفتاح السري الحقيقي (Live Secret Key)</label>
        <input class="inp" id="ch_lsk" dir="ltr" value="${esc(ch.liveSecretKey || '')}" placeholder="live_sk_...">

        <button class="btn-pri" onclick="saveChargily()">💾 حفظ إعدادات ومفاتيح شارجيلي</button>
        <div id="ch_msg"></div>
      </div>

      <div class="card">
        <h3>🔑 تغيير البريد الإلكتروني وكلمة السر للمدير</h3>
        <label class="lbl">البريد الإلكتروني الجديد</label>
        <input class="inp" id="new_em" dir="ltr" placeholder="admin@rioxstore.shop">
        <label class="lbl">كلمة السر الجديدة (6 أحرف فأكثر)</label>
        <input class="inp" id="new_pw" type="password" dir="ltr" placeholder="••••••••">
        <button class="btn-pri" onclick="saveCreds()">تحديث بيانات الدخول</button>
        <div id="cred_msg"></div>
      </div>

      <div class="card">
        <h3>🧹 تصفية وتنظيف قاعدة البيانات</h3>
        <p style="font-size:13px;color:var(--mut);margin:8px 0">يحذف أي مدراء وهميين، ويمكنك أيضاً مسح الطلبات التجريبية للبدء بقاعدة بيانات نظيفة 100%.</p>
        <button class="btn-bad" onclick="cleanDb(false)">حذف المدراء الوهميين فقط</button>
        <button class="btn-bad" onclick="cleanDb(true)">تصفير شامل (حذف الطلبات التجريبية + المدراء الوهميين)</button>
      </div>`;
  }

  document.getElementById('root').innerHTML = `
    <div class="top-bar">
      <button class="btn-sm" onclick="logout()">خروج 🔒</button>
      <button class="btn-sm" onclick="loadPanel()">تحديث 🔄</button>
      <h2>OVIRA PLAY</h2>
    </div>
    <div class="tabs">
      <button class="tab ${tab === 'orders' ? 'on' : ''}" onclick="tab='orders';loadPanel()">الطلبات</button>
      <button class="tab ${tab === 'stats' ? 'on' : ''}" onclick="tab='stats';loadPanel()">الإحصائيات</button>
      <button class="tab ${tab === 'settings' ? 'on' : ''}" onclick="tab='settings';loadPanel()">⚙️ الإعدادات وشارجيلي</button>
    </div>
    ${content}`;
}

async function saveChargily() {
  const payload = {
    mode: document.getElementById('ch_mode').value,
    testPublicKey: document.getElementById('ch_tpk').value,
    testSecretKey: document.getElementById('ch_tsk').value,
    livePublicKey: document.getElementById('ch_lpk').value,
    liveSecretKey: document.getElementById('ch_lsk').value
  };
  const r = await fetch(`${API}/settings/chargily`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(payload)
  });
  const d = await r.json();
  document.getElementById('ch_msg').innerHTML = `<div class="${d.success ? 'ok-msg' : 'err-msg'}">${esc(d.message)}</div>`;
}

async function saveCreds() {
  const newEmail = document.getElementById('new_em').value;
  const newPassword = document.getElementById('new_pw').value;
  const r = await fetch(`${API}/settings/credentials`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ newEmail, newPassword })
  });
  const d = await r.json();
  document.getElementById('cred_msg').innerHTML = `<div class="${d.success ? 'ok-msg' : 'err-msg'}">${esc(d.message)}</div>`;
}

async function cleanDb(deleteOrders) {
  if (!confirm(deleteOrders ? 'هل أنت متأكد من مسح كل الطلبات التجريبية والمدراء الوهميين؟' : 'هل تريد مسح جميع المدراء الوهميين والإبقاء على حسابك فقط؟')) return;
  const r = await fetch(`${API}/settings/clean-db`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ deleteOrders })
  });
  const d = await r.json();
  alert(d.message || 'تمت العملية');
  loadPanel();
}

async function upStatus(id, status) {
  await fetch(`${API}/orders/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ status })
  });
  loadPanel();
}

async function saveNote(id) {
  const adminNote = document.getElementById('nt_' + id).value;
  await fetch(`${API}/orders/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ adminNote })
  });
  loadPanel();
}

async function dlCsv() {
  const r = await fetch(`${API}/export`, { headers: { 'Authorization': 'Bearer ' + token } });
  if (!r.ok) return alert('غير مصرح أو فشل التحميل');
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'orders.csv';
  a.click();
}

loadPanel();
</script>
</body>
</html>
